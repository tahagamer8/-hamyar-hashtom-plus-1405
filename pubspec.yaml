name: hamyar_hashtom_plus
description: فهمینو - اپلیکیشن کمک‌آموزشی پایه هشتم
publish_to: 'none'
version: 2.4.0+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  open_filex: ^5.0.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  pdfx: ^2.11.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/catalog_fa.json
    - assets/content/subjects/
    - assets/content/video_lessons_fa.json
    - assets/content/pdf_resources.json
    - assets/images/fahmino_app_icon.jpg
    - assets/generated_pdfs/
    - assets/generated_pdfs/chapters/
    - assets/generated_pdfs/chapters/arabic/
    - assets/generated_pdfs/chapters/art/
    - assets/generated_pdfs/chapters/english/
    - assets/generated_pdfs/chapters/english_workbook/
    - assets/generated_pdfs/chapters/math/
    - assets/generated_pdfs/chapters/persian/
    - assets/generated_pdfs/chapters/quran/
    - assets/generated_pdfs/chapters/religion/
    - assets/generated_pdfs/chapters/science/
    - assets/generated_pdfs/chapters/social/
    - assets/generated_pdfs/chapters/thinking/
    - assets/generated_pdfs/chapters/work/
    - assets/generated_pdfs/chapters/writing/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Bold.ttf
          weight: 700
