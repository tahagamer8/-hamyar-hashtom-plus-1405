name: hamyar_hashtom_plus
description: فهمینو - اپلیکیشن کمک‌آموزشی پایه هشتم
publish_to: 'none'
version: 2.1.1+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  open_filex: ^5.0.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  pdfrx: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/catalog_fa.json
    - assets/content/pdf_resources.json
    - assets/content/subjects/
    - assets/generated_pdfs/
    - assets/generated_pdfs/chapters/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Bold.ttf
          weight: 700
