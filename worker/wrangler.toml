name = "fahmino-api-2"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# GEMINI_API_KEY را اینجا ننویس؛ فقط به‌صورت Secret روی سرویس تنظیم شود.

# محدودسازی تقریبی: حداکثر ۲۰ درخواست از هر IP در هر ۶۰ ثانیه.
# namespace_id باید در حساب Cloudflare یکتا باشد.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "481206"
[ratelimits.simple]
limit = 20
period = 60
