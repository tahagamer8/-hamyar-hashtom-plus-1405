name: Build Fahmino Full APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fahmino-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name fahminofull --org ir.fahmino.clone /tmp/fahmino
            cp -r /tmp/fahmino/android ./android
          fi
          sed -i 's/android:label="[^"]*"/android:label="فهمینو"/' android/app/src/main/AndroidManifest.xml

      - name: Install Pillow for launcher icon generation
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'

      - name: Configure separate Android identity and app branding
        run: python tooling/configure_android_branding.py

      - name: Cache Gradle distributions and dependencies
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Ensure Vazirmatn fonts
        run: |
          if [ ! -f assets/fonts/Vazirmatn/Vazirmatn-Regular.ttf ]; then
            mkdir -p assets/fonts/Vazirmatn /tmp/vazir
            curl -fL -o /tmp/vazir.zip https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip
            unzip -q /tmp/vazir.zip -d /tmp/vazir
            find /tmp/vazir -type f -name 'Vazirmatn-Regular.ttf' -exec cp {} assets/fonts/Vazirmatn/ \;
            find /tmp/vazir -type f -name 'Vazirmatn-Medium.ttf' -exec cp {} assets/fonts/Vazirmatn/ \;
            find /tmp/vazir -type f -name 'Vazirmatn-SemiBold.ttf' -exec cp {} assets/fonts/Vazirmatn/ \;
            find /tmp/vazir -type f -name 'Vazirmatn-Bold.ttf' -exec cp {} assets/fonts/Vazirmatn/ \;
          fi
          test -s assets/fonts/Vazirmatn/Vazirmatn-Regular.ttf
          test -s assets/fonts/Vazirmatn/Vazirmatn-Medium.ttf
          test -s assets/fonts/Vazirmatn/Vazirmatn-SemiBold.ttf
          test -s assets/fonts/Vazirmatn/Vazirmatn-Bold.ttf

      - name: Install PDF generation dependencies
        run: python -m pip install --disable-pip-version-check 'reportlab>=4.2,<5' 'arabic-reshaper>=3,<4' 'python-bidi>=0.6,<1'

      - name: Test Persian PDF text direction
        run: python -m unittest tooling.test_pdf_bidi

      - name: Test Android branding configuration
        run: python -m unittest tooling.test_android_branding

      - name: Audit chapter-by-chapter educational content quality
        run: |
          python -m unittest tooling.test_content_quality_audit
          python tooling/audit_content_quality.py \
            --subjects-dir assets/content/subjects \
            --output-json build/content-quality-audit/content-quality-audit.json \
            --output-markdown build/content-quality-audit/content-quality-audit.md

      - name: Generate Persian PDF assets
        run: |
          python tooling/generate_learning_pdfs.py --subjects-dir assets/content/subjects --output-dir assets/generated_pdfs
          test -s assets/generated_pdfs/Fahmino-Grade8-Notes-FA.pdf
          test -s assets/generated_pdfs/Fahmino-Grade8-Sample-Questions-FA.pdf
          test "$(find assets/generated_pdfs -maxdepth 1 -name 'Fahmino-*-FA.pdf' | wc -l)" -eq 15
          for subject in arabic art english english_workbook math persian quran religion science social thinking work writing; do
            test -s "assets/generated_pdfs/Fahmino-$subject-FA.pdf"
          done

      - name: Generate per-chapter PDF packs
        run: |
          python tooling/generate_chapter_pdfs.py --subjects-dir assets/content/subjects --output-dir assets/generated_pdfs
          test "$(find assets/generated_pdfs/chapters -type f -name '*.pdf' | wc -l)" -eq 290
          for subject in arabic art english english_workbook math persian quran religion science social thinking work writing; do
            test -s "assets/generated_pdfs/chapters/$subject/Fahmino-$subject-Chapter-1-Notes-FA.pdf"
            test -s "assets/generated_pdfs/chapters/$subject/Fahmino-$subject-Chapter-1-Questions-FA.pdf"
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run widget and unit tests
        timeout-minutes: 15
        run: flutter test --reporter expanded

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify offline chapter PDFs are packaged in every ABI APK
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          subject_dir = Path("assets/content/subjects")
          subject_ids = [
              "arabic", "art", "english", "english_workbook", "math",
              "persian", "quran", "religion", "science", "social",
              "thinking", "work", "writing",
          ]
          expected = set()
          for subject_id in subject_ids:
              pack = json.loads((subject_dir / f"{subject_id}.json").read_text(encoding="utf-8"))
              for index, _chapter in enumerate(pack["chapters"], start=1):
                  prefix = f"assets/flutter_assets/assets/generated_pdfs/chapters/{subject_id}/Fahmino-{subject_id}-Chapter-{index}"
                  expected.add(prefix + "-Notes-FA.pdf")
                  expected.add(prefix + "-Questions-FA.pdf")

          if len(expected) != 290:
              raise SystemExit(f"Expected 290 unique chapter PDFs, got {len(expected)}")

          apk_dir = Path("build/app/outputs/flutter-apk")
          apks = sorted(apk_dir.glob("app-*-release.apk"))
          if len(apks) != 3:
              raise SystemExit(f"Expected three split-ABI APKs, found {len(apks)}")

          for apk in apks:
              with zipfile.ZipFile(apk) as archive:
                  packaged = set(archive.namelist())
              missing = expected - packaged
              if missing:
                  raise SystemExit(f"{apk.name} is missing {len(missing)} chapter PDFs: {sorted(missing)[:5]}")
              print(f"{apk.name}: verified all {len(expected)} chapter PDFs")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: fahmino-full-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: fahmino-learning-pdfs
          path: assets/generated_pdfs/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: fahmino-content-quality-audit
          path: build/content-quality-audit/*
          if-no-files-found: error
