name: Build Fahmino Separate APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fahmino-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name fahminoseparate --org ir.fahmino.clone /tmp/fahmino
            cp -r /tmp/fahmino/android ./android
          fi
          sed -i 's/android:label="[^"]*"/android:label="فهمینو"/' android/app/src/main/AndroidManifest.xml

      - name: Cache Gradle distributions and dependencies
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Ensure Vazirmatn fonts
        run: |
          if [ ! -f assets/fonts/Vazirmatn/Vazirmatn-Regular.ttf ]; then
            mkdir -p assets/fonts/Vazirmatn /tmp/vazir
            curl -fL -o /tmp/vazir.zip https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip
            unzip -q /tmp/vazir.zip -d /tmp/vazir
            find /tmp/vazir -type f -name 'Vazirmatn-Regular.ttf' -exec cp {} assets/fonts/Vazirmatn/ \;
            find /tmp/vazir -type f -name 'Vazirmatn-Medium.ttf' -exec cp {} assets/fonts/Vazirmatn/ \;
            find /tmp/vazir -type f -name 'Vazirmatn-SemiBold.ttf' -exec cp {} assets/fonts/Vazirmatn/ \;
            find /tmp/vazir -type f -name 'Vazirmatn-Bold.ttf' -exec cp {} assets/fonts/Vazirmatn/ \;
          fi
          test -s assets/fonts/Vazirmatn/Vazirmatn-Regular.ttf
          test -s assets/fonts/Vazirmatn/Vazirmatn-Medium.ttf
          test -s assets/fonts/Vazirmatn/Vazirmatn-SemiBold.ttf
          test -s assets/fonts/Vazirmatn/Vazirmatn-Bold.ttf

      - name: Install PDF generation dependencies
        run: python -m pip install --disable-pip-version-check 'reportlab>=4.2,<5' 'arabic-reshaper>=3,<4' 'python-bidi>=0.6,<1'

      - name: Test Persian PDF text direction
        run: python -m unittest tooling.test_pdf_bidi tooling.test_learning_pdf_generation

      - name: Generate Persian PDF assets
        run: |
          rm -f assets/generated_pdfs/*.pdf
          python tooling/generate_learning_pdfs.py --subjects-dir assets/content/subjects --output-dir assets/generated_pdfs
          test -s assets/generated_pdfs/Fahmino-Grade8-Notes-FA.pdf
          test -s assets/generated_pdfs/Fahmino-Grade8-Sample-Questions-FA.pdf
          test -s assets/generated_pdfs/Fahmino-Grade8-First-Term-Exam-FA.pdf
          test -s assets/generated_pdfs/Fahmino-Grade8-Second-Term-Exam-FA.pdf
          test -s assets/generated_pdfs/Fahmino-Grade8-Gifted-Questions-FA.pdf
          test "$(find assets/generated_pdfs -maxdepth 1 -name 'Fahmino-*-FA.pdf' | wc -l)" -eq 70
          for subject in arabic art english english_workbook math persian quran religion science social thinking work writing; do
            test -s "assets/generated_pdfs/Fahmino-$subject-Notes-FA.pdf"
            test -s "assets/generated_pdfs/Fahmino-$subject-Questions-FA.pdf"
            test -s "assets/generated_pdfs/Fahmino-$subject-First-Term-FA.pdf"
            test -s "assets/generated_pdfs/Fahmino-$subject-Second-Term-FA.pdf"
            test -s "assets/generated_pdfs/Fahmino-$subject-Gifted-FA.pdf"
          done
          python - <<'PY'
          from pathlib import Path
          pdfs = sorted(Path("assets/generated_pdfs").glob("Fahmino-*-FA.pdf"))
          assert len(pdfs) == 70, f"Expected 70 PDFs, found {len(pdfs)}"
          for path in pdfs:
              with path.open("rb") as pdf:
                  assert pdf.read(5) == b"%PDF-", f"Invalid PDF header: {path}"
          print(f"Validated {len(pdfs)} non-empty PDF files.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run widget and unit tests
        timeout-minutes: 15
        run: flutter test --reporter expanded

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify release package identity and version
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          EXPECTED_APPLICATION_ID="ir.fahmino.clone.fahminoseparate"
          EXPECTED_VERSION_NAME="2.2.0"
          EXPECTED_VERSION_CODE="5"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='$EXPECTED_APPLICATION_ID' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'"
          echo "Verified applicationId=$EXPECTED_APPLICATION_ID version=$EXPECTED_VERSION_NAME+$EXPECTED_VERSION_CODE"

      - uses: actions/upload-artifact@v4
        with:
          name: fahmino-separate-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: fahmino-learning-pdfs
          path: assets/generated_pdfs/*.pdf
          if-no-files-found: error
